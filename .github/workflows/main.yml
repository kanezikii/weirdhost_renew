name: Minecraft一天一续

on:
  workflow_dispatch: 
  schedule:
    # UTC 04:05 对应北京时间中午 12:05 (错开5分钟防止并发触发CF盾)
    - cron: '5 4 * * *'

jobs:
  add_time:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Playwright and dependencies
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Run Time Adder Script
        env:
          REMEMBER_WEB_COOKIE: ${{ secrets.REMEMBER_WEB_COOKIE }}
          PTERODACTYL_EMAIL: ${{ secrets.PTERODACTYL_EMAIL }}
          PTERODACTYL_PASSWORD: ${{ secrets.PTERODACTYL_PASSWORD }}
        run: python Minecraft.py

      - name: Upload error artifacts
        if: failure() 
        uses: actions/upload-artifact@v4
        with:
          name: error-screenshots-mc
          path: "*.png"

      # 【新增】Telegram 消息通知
      - name: Send Telegram Notification
        if: always() 
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            MSG="✅ 【Minecraft (9bde6441)】 智能续期脚本执行成功/状态正常！"
          else
            MSG="❌ 【Minecraft (9bde6441)】 智能续期脚本执行失败，请登录 GitHub 查看日志！"
          fi
          curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT_ID}" \
            -d text="${MSG}"
